<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Splitter — TripEase</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/app.css"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"></head><body><div id="expenseApp"></div><script>const KEY='tripease_state_v1';let s=JSON.parse(localStorage.getItem(KEY)||'null')||{adults:4,children:0,budget:15000,expenses:[]};s.expenses=s.expenses||[];const people=['Rahul','Sai','Kiran','Arun'].slice(0,Math.max(2,s.adults||2));const save=()=>localStorage.setItem(KEY,JSON.stringify(s));const esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function render(){let total=s.expenses.reduce((a,e)=>a+e.amount,0),share=total/people.length;document.getElementById('expenseApp').innerHTML='<header class="navbar"><a class="brand" href="index.html"><span class="brand-mark">✈</span><span>Trip<span class="brand-accent">Ease</span></span></a><nav class="nav-links"><a href="index.html">Home</a><a href="planner.html">Plan Trip</a><a href="budget.html">Budget</a><a href="my-trips.html">My Trips</a></nav></header><main class="app-shell"><div class="page-head"><div><div class="eyebrow">TRIPEASE · GROUP TRAVEL</div><h1>Expense Splitter</h1><p>Track shared costs and see who owes whom.</p></div></div><div class="panel"><h2>Add expense</h2><form id="expenseForm" class="form-grid"><div class="field"><label>Category</label><select id="cat"><option>Transport</option><option>Hotel</option><option>Food</option><option>Tickets</option><option>Shopping</option><option>Other</option></select></div><div class="field"><label>Amount (₹)</label><input id="amount" type="number" min="1" required></div><div class="field"><label>Paid by</label><select id="paid">${people.map(p=>'<option>'+p+'</option>').join('')}</select></div><div class="field"><label>Description</label><input id="desc" placeholder="e.g. Dinner"></div><button class="btn primary">Add expense</button></form></div><div class="panel"><h2>Trip total · ₹${total.toLocaleString()}</h2><p style="color:var(--muted);font-size:12px">Equal share · ₹${Math.round(share).toLocaleString()} per person</p><div class="summary-grid">${people.map(p=>{let paid=s.expenses.filter(e=>e.paidBy===p).reduce((a,e)=>a+e.amount,0),net=paid-share;return '<div class="summary-item"><small>'+esc(p)+'</small><strong>Paid ₹'+paid.toLocaleString()+'</strong><p style="font-size:11px;color:'+(net>=0?'#176c59':'#b63e37')+'">'+(net>=0?'Receives ':'Owes ')+'₹'+Math.abs(Math.round(net)).toLocaleString()+'</p></div>'}).join('')}</div></div><div class="panel"><h2>Expenses</h2>${s.expenses.length?s.expenses.map((e,i)=>'<div class="trip-card" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b>'+esc(e.category)+'</b><small style="display:block;color:var(--muted)">'+esc(e.description||'Shared expense')+' · '+esc(e.paidBy)+'</small></div><strong>₹'+e.amount.toLocaleString()+'</strong><button class="btn secondary" onclick="removeExpense('+i+')">Delete</button></div>').join(''):'<p style="color:var(--muted);font-size:12px">No expenses added yet.</p>'}</div><div class="panel"><h2>Settlement suggestion</h2><p style="font-size:12px;color:var(--muted)">The prototype calculates each person's equal share. In a full settlement engine, the app can minimize transfers such as “Rahul pays ₹500 to Sai.”</p></div></main><footer><div class="footer-bottom">© 2026 TripEase · Expense data stored locally in this browser.</div></footer>';document.getElementById('expenseForm').onsubmit=e=>{e.preventDefault();s.expenses.push({category:cat.value,amount:+amount.value,paidBy:paid.value,description:desc.value});save();render()}}function removeExpense(i){s.expenses.splice(i,1);save();render()}render();</script></body></html>
